name: Desktop-App (Windows) bauen

# Baut die Windows-App (desktop/) auf einem echten Windows-Runner:
# 2Do-Setup-<version>.exe (Installer) und 2Do-<version>-portable.exe.
# - bei Änderungen auf main oder einem claude/…-Arbeitsbranch: als Artefakt am
#   Workflow-Lauf herunterladbar
# - bei einem Tag "desktop-v*" zusätzlich als GitHub-Release
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "desktop/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/desktop.yml"
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Web-App + Windows-App bauen
        run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: 2Do-Windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error
      - name: Release anlegen (nur bei Tag desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 2Do für Windows ${{ github.ref_name }}
          body: |
            **2Do-Setup-….exe** installiert 2Do (Startmenü, Windows-Hinweise, Autostart).
            **2Do-…-portable.exe** startet ohne Installation.

            Die Dateien sind nicht signiert: Windows SmartScreen fragt beim ersten Start nach
            („Weitere Informationen" → „Trotzdem ausführen").
          files: desktop/release/*.exe
