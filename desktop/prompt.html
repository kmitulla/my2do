<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>2Do</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
  .card {
    width: 100%; box-sizing: border-box; padding: 18px 18px 14px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.96), rgba(238,242,255,.94));
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 18px 40px -12px rgba(30,41,99,.45), 0 0 0 1px rgba(99,102,241,.12);
    animation: pop .22s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop { from { transform: scale(.94) translateY(6px); opacity: 0 } }
  label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 10px; }
  input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; color: #0f172a;
    padding: 9px 12px; border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; outline: none;
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  button { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-radius: 12px; padding: 8px 16px; cursor: pointer; }
  .cancel { background: #f1f5f9; color: #475569; }
  .ok { background: linear-gradient(90deg, #3b82f6, #6366f1); color: #fff; box-shadow: 0 6px 16px -6px rgba(99,102,241,.7); }
</style>
</head>
<body>
  <form class="card" id="f">
    <label id="m" for="v"></label>
    <input id="v" autocomplete="off">
    <div class="row">
      <button type="button" class="cancel" id="c">Abbrechen</button>
      <button type="submit" class="ok">OK</button>
    </div>
  </form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("m").textContent = q.get("message") || "";
  const input = document.getElementById("v");
  input.value = q.get("value") || "";
  input.focus();
  input.select();
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); window.promptApi.answer(input.value); });
  document.getElementById("c").addEventListener("click", () => window.promptApi.answer(null));
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") window.promptApi.answer(null); });
</script>
</body>
</html>
